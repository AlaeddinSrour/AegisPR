name: 'AegisPR'
description: 'AI-driven Code Review and Vulnerability Detection using Gemini'
author: 'AegisPR'
inputs:
  github_token:
    description: 'GITHUB_TOKEN to interact with the repository'
    required: true
  gemini_api_key:
    description: 'API Key for Google Gemini'
    required: true
  blocking_severities:
    description: 'Comma-separated list of severities that block the build'
    required: false
    default: 'CRITICAL,HIGH'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    INPUT_BLOCKING_SEVERITIES: ${{ inputs.blocking_severities }}
