name: "AI Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai_review:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push auto-fixes back to the branch
      pull-requests: write # Required to post comments on the PR
    steps:
      - name: Checkout trusted AegisPR action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .aegispr-action
          persist-credentials: false

      - name: Checkout pull-request code as audit data
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false
          persist-credentials: false
      
      - name: Run AegisPR
        uses: ./.aegispr-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          ai_provider: auto
          semgrep_rule_mode: bundled
          findings_per_batch: '8'
          fail_on_incomplete: 'true'
